# Nixpacks build config for Railway.
#
# Adds Chromium so Remotion's headless renderer (motion/render-worker.ts) has
# the browser + shared libraries it needs — these are absent from the minimal
# Nixpacks base image. The "..." entry keeps Nixpacks' auto-detected packages
# (Node, npm) and appends chromium.
#
# The build also installs the motion/ package's own dependencies (the
# @remotion/* packages live there, separate from the root package.json).

[phases.setup]
nixPkgs = ["...", "chromium"]

[phases.install]
cmds = [
  "npm install",
  "npm --prefix motion install",
]

[phases.build]
cmds = ["npx vite build"]

[variables]
# Point Remotion at the Nixpacks-provided Chromium instead of downloading its
# own headless shell (the download can fail on a read-only/limited container).
REMOTION_CHROME_EXECUTABLE = "/nix/var/nix/profiles/default/bin/chromium"
